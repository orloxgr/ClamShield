name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  validate:
    name: Validate
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run lint

      - name: VirusTotal on-demand queue tests
        run: npm run test:virustotal-scan

      - name: FreshClam timeout tests
        run: npm run test:updates

      - name: Desktop startup tests
        run: npm run test:startup

      - name: Build
        run: npm run build

      - name: Critical dependency audit
        run: npm run audit:critical
