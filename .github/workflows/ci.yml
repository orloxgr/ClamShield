name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  validate:
    name: Validate
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run lint

      - name: VirusTotal on-demand queue tests
        run: npm run test:virustotal-scan

      - name: FreshClam timeout tests
        run: npm run test:updates

      - name: Exception reporting tests
        run: npm run test:exceptions

      - name: Desktop startup tests
        run: npm run test:startup

      - name: Real Electron navigation test
        run: npm run test:desktop-navigation

      - name: Threat notification tests
        run: npm run test:alerts

      - name: Release security gate tests
        run: npm run test:release-security

      - name: Build
        run: npm run build

      - name: Full dependency security gate
        run: npm run audit:security
