name: Release Build

on:
  workflow_dispatch:

jobs:
  windows-installer:
    name: Windows Installer
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run lint

      - name: Build installer
        run: npm run build:exe

      - name: Generate checksums
        run: npm run release:checksums

      - name: Read package version
        id: package
        shell: pwsh
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          "version=$($package.version)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Generate installer attestation
        uses: actions/attest@v4
        with:
          subject-path: |
            release/${{ steps.package.outputs.version }}/ClamShield-Setup-${{ steps.package.outputs.version }}.exe
            release/${{ steps.package.outputs.version }}/ClamShield-Setup-${{ steps.package.outputs.version }}.exe.blockmap
            release/${{ steps.package.outputs.version }}/latest.yml
            release/${{ steps.package.outputs.version }}/SHA256SUMS.txt

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ClamShield-${{ steps.package.outputs.version }}-windows
          path: |
            release/${{ steps.package.outputs.version }}/ClamShield-Setup-${{ steps.package.outputs.version }}.exe
            release/${{ steps.package.outputs.version }}/ClamShield-Setup-${{ steps.package.outputs.version }}.exe.blockmap
            release/${{ steps.package.outputs.version }}/latest.yml
            release/${{ steps.package.outputs.version }}/SHA256SUMS.txt
          if-no-files-found: error
