name: Release Build
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Published full commit SHA or vX.Y.Z tag, matching the workflow run commit'
        required: true
        type: string
      publish:
        description: Publish the verified artifacts as the latest release
        default: false
        type: boolean
      artifact_run_id:
        description: 'Optional successful Release Build run ID: publish its exact tested artifact without rebuilding'
        default: ''
        type: string
permissions:
  contents: read
concurrency:
  group: clamshield-release
  cancel-in-progress: false
jobs:
  build:
    if: inputs.artifact_run_id == ''
    name: Validate, sign and attest
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      version: ${{ steps.source.outputs.version }}
      tag: ${{ steps.source.outputs.tag }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      run_id: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
          cache: npm
      - name: Fix and verify release source
        id: source
        env:
          RELEASE_SOURCE_REF: ${{ inputs.source_ref }}
        run: node scripts/release-source.cjs
      - run: npm ci
      - name: All checks, identical to CI
        uses: ./.github/actions/validate
      - name: Audit every dependency before packaging
        run: npm run audit:security
      - name: Import release signing key
        timeout-minutes: 2
        env:
          RELEASE_PFX_BASE64: ${{ secrets.RELEASE_PFX_BASE64 }}
          RELEASE_PFX_PASSWORD: ${{ secrets.RELEASE_PFX_PASSWORD }}
        run: ./scripts/import-release-certificate.ps1
      - name: Build and sign installer once
        run: npm run build:exe -- --win nsis --x64 --publish never
      - name: Final signing and updater metadata
        run: node scripts/finalize-release.cjs
      - name: Verify all release signatures
        env:
          RELEASE_VERSION: ${{ steps.source.outputs.version }}
        run: ./scripts/verify-release-signatures.ps1 -Directory "release/$env:RELEASE_VERSION"
      - name: Final checksums and immutable release manifest
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          RELEASE_VERSION: ${{ steps.source.outputs.version }}
        run: |
          npm run release:checksums
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/release-manifest.cjs create "release/$env:RELEASE_VERSION" $env:SOURCE_SHA $env:RELEASE_VERSION
      - name: Attest final signed bytes and manifests
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            release/${{ steps.source.outputs.version }}/ClamShield-Setup-${{ steps.source.outputs.version }}.exe
            release/${{ steps.source.outputs.version }}/ClamShield-Setup-${{ steps.source.outputs.version }}.exe.blockmap
            release/${{ steps.source.outputs.version }}/latest.yml
            release/${{ steps.source.outputs.version }}/SHA256SUMS.txt
            release/${{ steps.source.outputs.version }}/release-manifest.json
      - name: Save provenance and verify sealed bytes
        env:
          ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          RELEASE_VERSION: ${{ steps.source.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          Copy-Item -LiteralPath $env:ATTESTATION_BUNDLE -Destination "release/$env:RELEASE_VERSION/provenance.json"
          node scripts/release-manifest.cjs verify "release/$env:RELEASE_VERSION" $env:SOURCE_SHA $env:RELEASE_VERSION
      - name: Upload the sealed release, without rebuilding
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ClamShield-${{ steps.source.outputs.sha }}
          path: |
            release/${{ steps.source.outputs.version }}/ClamShield-Setup-${{ steps.source.outputs.version }}.exe
            release/${{ steps.source.outputs.version }}/ClamShield-Setup-${{ steps.source.outputs.version }}.exe.blockmap
            release/${{ steps.source.outputs.version }}/latest.yml
            release/${{ steps.source.outputs.version }}/SHA256SUMS.txt
            release/${{ steps.source.outputs.version }}/release-manifest.json
            release/${{ steps.source.outputs.version }}/provenance.json
          if-no-files-found: error
          overwrite: false
      - name: Remove imported signing key
        if: always()
        shell: pwsh
        run: |
          if ($env:CLAMSHIELD_CODESIGN_SHA1 -match '^[A-Fa-f0-9]{40}$') {
            foreach ($store in @('CurrentUser\My', 'LocalMachine\Root')) {
              $certificatePath = "Cert:\$store\$env:CLAMSHIELD_CODESIGN_SHA1"
              if (Test-Path -LiteralPath $certificatePath) { Remove-Item -LiteralPath $certificatePath -Force }
            }
          }
  reuse:
    name: Select original verified release artifact
    if: inputs.artifact_run_id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.artifact.outputs.sha }}
      version: ${{ steps.artifact.outputs.version }}
      tag: ${{ steps.artifact.outputs.tag }}
      artifact_id: ${{ steps.artifact.outputs.artifact_id }}
      run_id: ${{ steps.artifact.outputs.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
      - name: Verify original release run and immutable artifact
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SOURCE_REF: ${{ inputs.source_ref }}
          RELEASE_ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
        run: node scripts/reuse-release-artifact.cjs
  publish:
    name: Verify provenance and publish identical installer
    needs: [build, reuse]
    if: always() && inputs.publish && (needs.build.result == 'success' || needs.reuse.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      attestations: read
      actions: read
    env:
      SOURCE_SHA: ${{ needs.build.outputs.sha || needs.reuse.outputs.sha }}
      RELEASE_VERSION: ${{ needs.build.outputs.version || needs.reuse.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.sha || needs.reuse.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id || needs.reuse.outputs.artifact_id }}
          run-id: ${{ needs.build.outputs.run_id || needs.reuse.outputs.run_id }}
          github-token: ${{ github.token }}
          path: sealed-release
          merge-multiple: true
      - name: Verify checksums and source binding
        run: node scripts/release-manifest.cjs verify sealed-release "$SOURCE_SHA" "$RELEASE_VERSION"
      - name: Verify GitHub build provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for file in "ClamShield-Setup-$RELEASE_VERSION.exe" "ClamShield-Setup-$RELEASE_VERSION.exe.blockmap" latest.yml SHA256SUMS.txt release-manifest.json; do
            gh attestation verify "sealed-release/$file" --bundle sealed-release/provenance.json --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-build.yml" --source-digest "$SOURCE_SHA"
          done
      - name: Upload, compare server digests and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-release.cjs sealed-release "$SOURCE_SHA" "$RELEASE_VERSION"
