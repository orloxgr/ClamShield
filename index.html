<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <style>html,body{margin:0;background:#020617;color:#e2e8f0}</style>
    <link rel="stylesheet" href="/startup.css" />
    <link rel="icon" type="image/svg+xml" href="/shield.svg" />
    <title>ClamShield</title>
  </head>
  <body>
    <div id="root">
      <div class="startup-shell" aria-busy="true">
        <aside class="startup-sidebar" aria-label="ClamShield navigation" aria-disabled="true">
          <div class="startup-brand"><img src="/shield.svg" width="32" height="32" alt="" aria-hidden="true">ClamShield</div>
          <div class="startup-nav"><div>Dashboard</div><div>Shield</div><div>On-Demand Scan</div><div>Scheduled Scanner</div><div>Results</div><div>Exceptions</div><div>Quarantine</div><div>DNS Protection</div><div>Updates</div><div>History</div><div>Settings</div></div>
          <div class="startup-footer">Made by Byron Iniotakis</div>
        </aside>
        <main class="startup-main">
          <header class="startup-header"><h1>ClamShield</h1><p>System protection overview</p></header>
          <div class="startup-content"><section class="startup-loading" role="status"><span class="startup-spinner" aria-hidden="true"></span><h2>Loading ClamShield…</h2><p>Loading your protection status…</p></section></div>
        </main>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
