<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ClamShield Alert</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, Segoe UI, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      background: linear-gradient(180deg, #111827 0%, #0f172a 100%);
      border: 1px solid rgba(239, 68, 68, 0.35);
    }

    .wrap {
      height: 100%;
      padding: 14px 16px;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      gap: 8px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .title {
      min-width: 0;
      flex: 1;
    }

    .icon {
      width: 34px;
      height: 34px;
      border-radius: 999px;
      display: grid;
      place-items: center;
      background: rgba(239, 68, 68, 0.16);
      color: #f87171;
      font-weight: 800;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    h1 {
      margin: 0;
      font-size: 15px;
      line-height: 1.2;
      color: #f8fafc;
    }

    .sub {
      margin-top: 2px;
      font-size: 12px;
      color: #fca5a5;
    }

    .details {
      min-width: 0;
      display: grid;
      gap: 5px;
      align-content: start;
      overflow: auto;
    }

    .action-error { margin: 0; color: #fca5a5; font-size: 12px; line-height: 1.4; }
    .providers { color: #94a3b8; font-size: 11px; }

    .name {
      font-size: 13px;
      font-weight: 700;
      color: #fb7185;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .path {
      font-family: Consolas, "SFMono-Regular", monospace;
      font-size: 11px;
      line-height: 1.35;
      color: #94a3b8;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      word-break: break-all;
    }

    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      flex-wrap: nowrap;
      min-width: 0;
    }

    button {
      border: 1px solid transparent;
      border-radius: 7px;
      padding: 7px 10px;
      font-size: 12px;
      font-weight: 700;
      color: white;
      cursor: pointer;
      white-space: nowrap;
    }

    button:disabled {
      opacity: 0.6;
      cursor: default;
    }

    .close {
      width: 30px;
      height: 30px;
      padding: 0;
      border-radius: 999px;
      background: transparent;
      border-color: transparent;
      color: #94a3b8;
      font-size: 18px;
      line-height: 1;
    }

    .close:hover {
      background: rgba(148, 163, 184, 0.12);
      color: #e2e8f0;
    }

    .secondary {
      background: #1e293b;
      color: #cbd5e1;
      border-color: #334155;
    }

    .danger {
      background: #dc2626;
      border-color: #ef4444;
    }

    .warning {
      background: #d97706;
      border-color: #f59e0b;
    }
  /* Long translations wrap; actions remain reachable in a small notification. */
    body { overflow-y: auto; overflow-x: hidden; }
    .wrap { min-height: 100%; height: auto; }
    .actions { flex-wrap: wrap; }
    button { max-width: 100%; overflow-wrap: anywhere; }
    .header > div { min-width: 0; }
    h1, .sub, .details { overflow-wrap: anywhere; }
  </style>
<script src="localization-browser.js"></script>
<script src="localize-page.js"></script>
</head>
<body>
  <main class="wrap">
    <audio id="alertSound" src="/alert.wav" preload="auto"></audio>
    <section class="header">
      <div class="icon">!</div>
      <div class="title">
        <h1>Threat Detected</h1>
        <div class="sub">ClamShield found a suspicious file</div>
      </div>
      <button id="closeBtn" class="close" type="button" aria-label="Close alert" title="Close alert">&times;</button>
    </section>

    <section class="details">
      <div data-no-localize id="threatName" class="name"></div>
      <div data-no-localize id="threatPath" class="path"></div>
      <div id="providers" class="providers" hidden></div>
      <p id="actionError" class="action-error" role="alert" hidden></p>
    </section>

    <section class="actions">
      <button id="exceptionBtn" class="secondary" type="button">Add exception</button>
      <button id="laterBtn" class="secondary" type="button">Decide later</button>
      <button id="quarantineBtn" class="danger" type="button">Quarantine</button>
    </section>
  </main>

  <script>
const params = new URLSearchParams(window.location.search);
const threatId = params.get("id") || "";
const port = params.get("port") || window.location.port;
const name = params.get("name") || englishText("desktop.alert.html.unknown_threat");
const filePath = params.get("path") || englishText("desktop.alert.html.unknown_path");
const mode = params.get("mode") || "decision";
const title = params.get("title") || (mode === "notice" ? englishText("desktop.alert.html.threat_handled") : englishText("desktop.alert.threat_detected"));
const subtitle = params.get("subtitle") || (mode === "notice" ? englishText("desktop.alert.html.clamshield_handled_a_suspicious_file") : englishText("desktop.alert.clamshield_found_a_suspicious_file"));
const playSound = params.get("playSound") !== "false";
const bridge = window.clamshieldAlert;
function logPopupError(message, details) {
    if (bridge && typeof bridge.log === "function") {
        bridge.log({ level: "error", message, details }).catch(() => { });
        return;
    }
    fetch(`http://127.0.0.1:${port}/api/client-log`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ level: "error", message, details }),
        keepalive: true
    }).catch(() => { });
}
window.addEventListener("error", event => {
    logPopupError(englishText("desktop.alert.html.threat_popup_renderer_error"), {
        message: event.message,
        filename: event.filename,
        lineno: event.lineno,
        colno: event.colno,
        stack: event.error && event.error.stack
    });
});
window.addEventListener("unhandledrejection", event => {
    const reason = event.reason || {};
    logPopupError(englishText("desktop.alert.html.threat_popup_promise_rejection"), {
        message: reason.message || String(reason),
        stack: reason.stack
    });
});
document.querySelector("h1").textContent = title;
document.querySelector(".sub").textContent = subtitle;
document.getElementById("threatName").textContent = name;
document.getElementById("threatPath").textContent = filePath;
if (bridge && typeof bridge.onUpdate === "function") {
    bridge.onUpdate(threat => {
        document.getElementById("threatName").textContent = threat.threatName || name;
        const providers = [...new Set((threat.detections || []).map(detection => detection.engine))].filter(Boolean);
        const label = document.getElementById("providers");
        label.textContent = providers.length > 1 ? englishText("desktop.alert.html.detected_by", {
            value1: String(providers.join(" + "))
        }) : "";
        label.hidden = !label.textContent;
    });
}
const dismiss = () => mode === "notice" ? window.close() : sendAction("results");
if (mode !== "notice")
    document.getElementById("closeBtn").title = englishText("desktop.alert.decide_later");
document.getElementById("closeBtn").addEventListener("click", dismiss);
window.addEventListener("keydown", event => {
    if (event.key === "Escape")
        dismiss();
});
if (mode === "notice") {
    const actions = document.querySelector(".actions");
    actions.replaceChildren();
    const close = document.createElement('button');
    close.id = 'noticeCloseBtn'; close.className = 'secondary'; close.type = 'button'; close.textContent = 'Close';
    actions.appendChild(close);
    document.getElementById("noticeCloseBtn").addEventListener("click", () => window.close());
}
if (playSound) {
    const audio = document.getElementById("alertSound");
    audio.volume = 0.55;
    audio.play().catch(() => { });
}
let actionInProgress = false;
async function sendAction(action) {
    if (actionInProgress)
        return;
    actionInProgress = true;
    const buttons = document.querySelectorAll("button");
    const errorMessage = document.getElementById("actionError");
    errorMessage.hidden = true;
    buttons.forEach(button => button.disabled = true);
    try {
        if (bridge && typeof bridge.sendAction === "function") {
            const result = await bridge.sendAction({ id: threatId, action });
            if (result && result.success === false)
                throw new Error(result.error || englishText("desktop.alert.html.action_failed"));
        }
        else {
            const response = await fetch(`http://127.0.0.1:${port}/api/pending-threats/${encodeURIComponent(threatId)}/action`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ action })
            });
            const result = await response.json().catch(() => ({}));
            if (!response.ok || result.success === false)
                throw new Error(result.error || englishText("desktop.alert.html.action_failed"));
        }
        window.close();
    }
    catch (error) {
        logPopupError(englishText("desktop.alert.html.threat_popup_action_failed"), {
            action,
            threatId,
            message: error && error.message ? error.message : String(error)
        });
        errorMessage.textContent = error && error.message ? error.message : englishText("desktop.alert.html.the_action_failed_try_again_or_choose_decide_later");
        errorMessage.hidden = false;
        actionInProgress = false;
        buttons.forEach(button => button.disabled = false);
    }
}
if (mode !== "notice") {
    document.getElementById("exceptionBtn").addEventListener("click", () => sendAction("exception"));
    document.getElementById("laterBtn").addEventListener("click", () => sendAction("results"));
    document.getElementById("quarantineBtn").addEventListener("click", () => sendAction("quarantine"));
}

</script>
</body>
</html>
